<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SettleUp – Settlement. See net balances and the minimum payments needed to settle up." />
    <title>SettleUp – Settlement</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .result-box {
            background: #1e293b;
            border-radius: 8px;
            padding: 15px 20px;
            margin-top: 15px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">SettleUp</span>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="expenses.html">Transactions</a>
            <a href="group_expense.html">Group Expense</a>
            <a href="settlement.html" class="active">Settlement</a>
        </nav>
    </header>

    <main class="container">

        <h1 class="page-title">Settlement</h1>

        <section class="section-card" aria-label="Settlement">

            <p style="color:#94a3b8; margin-bottom:15px;">
                Demo group ("Goa Trip" — Prachi, Rishab, Sanchita, Piyanshi)
                showing net balances and the minimum set of payments needed
                to settle everyone up.
            </p>

            <div id="balances-result" class="result-box">
                <h3>Net Balances</h3>
                <div id="balances-list">Loading...</div>
            </div>

            <button type="button" id="runSettlementButton" class="btn-primary" style="margin-top:15px;">
                Run Settlement
            </button>

            <div id="settlement-box" class="result-box">
                <h3>Who Pays Whom</h3>
                <div id="settlement-result">Click "Run Settlement" to calculate.</div>
            </div>

        </section>

    </main>

    <script src="js/settlementEngine.js"></script>

</body>
</html>
